<figure class="import-viz" aria-labelledby="import-viz-caption">
  <noscript><style>.import-viz__bar, .import-viz__status { display: none !important; }</style></noscript>

  <div class="import-viz__bar">
    <div class="import-viz__dots" aria-hidden="true"></div>
    <div class="import-viz__buttons">
      <button class="import-viz__btn" type="button" data-act="toggle" aria-pressed="false">Pause</button>
      <button class="import-viz__btn" type="button" data-act="replay">Replay</button>
    </div>
  </div>

  <div class="import-viz__canvas" tabindex="0" role="region" aria-label="Call path comparison. Scroll horizontally on small screens.">
  <svg viewBox="0 0 720 442" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="import-viz-title import-viz-desc">
    <title id="import-viz-title">One library call, two ways across</title>
    <desc id="import-viz-desc">Traditional FEX-style thunks pack arguments into a structure, cross a thunk, unpack on the host, and call the native library. Rosemary's supported fast imports use a compiled ABI conversion to call the native library, then continue in translated code. Flow is schematic, not measured time.</desc>
    <defs>
      <marker id="import-arrow-slow" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M1 1L7 4L1 7" fill="none" stroke="var(--iv-slow)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="import-arrow-fast" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
        <path d="M1 1L7 4L1 7" fill="none" stroke="var(--iv-fast)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>

    <text class="iv-title" x="28" y="38">One library call, two ways across</text>
    <text class="iv-muted" x="28" y="60">Same native destination. Different work at the boundary.</text>

    <g class="iv-lane iv-traditional">
      <g class="iv-step" data-label="A translated guest call reaches the boundary with its arguments in hand.">
        <g class="iv-head">
          <text class="iv-label" x="28" y="100">01 / TRADITIONAL LIBRARY THUNKS</text>
          <text class="iv-small" x="28" y="119">FEX-style pack → cross → unpack</text>
        </g>
        <g class="iv-box"><rect class="iv-node" x="28" y="140" width="114" height="54" rx="8"/><g class="iv-centered"><text x="85" y="162">Guest call</text><text class="iv-small" x="85" y="180">arguments</text></g></g>
      </g>

      <g class="iv-step" data-label="A guest-side packer copies every argument into a structure on the guest stack.">
        <path class="iv-wire" pathLength="100" d="M142 167H176"/><path class="iv-dart" d="M142 167H176"/>
        <g class="iv-box"><rect class="iv-node" x="176" y="140" width="106" height="54" rx="8"/><g class="iv-centered"><text x="229" y="162">Pack</text><text class="iv-small" x="229" y="180">into struct</text></g></g>
      </g>

      <g class="iv-step" data-label="A thunk operation crosses out of guest code and into the host side.">
        <path class="iv-wire" pathLength="100" d="M282 167H316"/><path class="iv-dart" d="M282 167H316"/>
        <g class="iv-box"><rect class="iv-node" x="316" y="140" width="106" height="54" rx="8"/><g class="iv-centered"><text x="369" y="162">Thunk</text><text class="iv-small" x="369" y="180">transition</text></g></g>
      </g>

      <g class="iv-step" data-label="A matching host-side unpacker reads the arguments back out of the structure.">
        <path class="iv-wire" pathLength="100" d="M422 167H456"/><path class="iv-dart" d="M422 167H456"/>
        <g class="iv-box"><rect class="iv-node" x="456" y="140" width="106" height="54" rx="8"/><g class="iv-centered"><text x="509" y="162">Unpack</text><text class="iv-small" x="509" y="180">from struct</text></g></g>
      </g>

      <g class="iv-step" data-label="Only now does the native library actually get called.">
        <path class="iv-wire" pathLength="100" d="M562 167H596"/><path class="iv-dart" d="M562 167H596"/>
        <g class="iv-box"><rect class="iv-host" x="596" y="140" width="96" height="54" rx="8"/><g class="iv-centered"><text x="644" y="162">Native</text><text class="iv-small" x="644" y="180">library</text></g></g>
      </g>

      <g class="iv-step" data-label="The result travels home the same way, back through both thunk wrappers.">
        <path class="iv-return" pathLength="100" d="M644 194V226H85V194"/><path class="iv-dart iv-dart--return" d="M644 194V226H85V194"/>
        <g class="iv-box"><text class="iv-small" x="250" y="246">result through the thunk wrappers</text></g>
      </g>
    </g>

    <g class="iv-lane iv-fast">
      <g class="iv-step" data-label="The same call, on the fast path: the guest values are already where the compiler can see them." data-region="178">
        <g class="iv-head"><path class="iv-divider" d="M28 264H692"/><text class="iv-label" x="28" y="294">02 / ROSEMARY FAST IMPORTS</text></g>
        <rect class="iv-region" x="20" y="308" width="482" height="74" rx="10"/>
        <g class="iv-box"><rect class="iv-node" x="28" y="318" width="162" height="54" rx="8"/><g class="iv-centered"><text x="109" y="340">Guest values</text><text class="iv-small" x="109" y="358">registers / stack</text></g></g>
      </g>

      <g class="iv-step" data-label="Microlift compiles the guest-to-host ABI conversion straight into the translated region." data-region="482">
        <path class="iv-wire" pathLength="100" d="M190 345H256"/><path class="iv-dart" d="M190 345H256"/>
        <g class="iv-box"><rect class="iv-node" x="256" y="318" width="238" height="54" rx="8"/><g class="iv-centered"><text x="375" y="340">Compiled native call</text><text class="iv-small" x="375" y="358">guest ABI → host ABI</text></g></g>
      </g>

      <g class="iv-step" data-label="The native library is reached with no packing struct and no VM dispatch detour.">
        <path class="iv-wire" pathLength="100" d="M494 345H580"/><path class="iv-dart" d="M494 345H580"/>
        <g class="iv-box"><rect class="iv-host" x="580" y="318" width="112" height="54" rx="8"/><g class="iv-centered"><text x="636" y="340">Native</text><text class="iv-small" x="636" y="358">library</text></g></g>
      </g>

      <g class="iv-step" data-label="Its return value becomes a guest register value and translated code simply carries on.">
        <path class="iv-return" pathLength="100" d="M636 382V412H109V382"/><path class="iv-dart iv-dart--return" d="M636 382V412H109V382"/>
        <g class="iv-box"><text class="iv-small" x="240" y="432">result → continue translated code</text></g>
      </g>
    </g>
  </svg>
  </div>

  <p class="import-viz__status" role="status" aria-live="polite"></p>

  <figcaption id="import-viz-caption">For supported signatures, the ABI conversion is compiled into the translated region. No argument-packing struct or VM dispatch detour. Flow is schematic, not a timing benchmark.</figcaption>
</figure>
