<!doctype html>
<html lang="en" data-ocean="open">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04202f">
  {%- seo -%}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- feed_meta -%}
  <script>
    // Set the depth before first paint, otherwise the default flashes on load.
    try {
      var d = localStorage.getItem('ocean');
      if (d === 'open' || d === 'twilight') document.documentElement.dataset.ocean = d;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Animated ocean backdrop, drawn in WebGL (assets/js/ocean.js).

       The whole water column is a single opaque fragment shader now: depth
       gradient, caustics, converging shafts, diffuse columns, blooms, haze,
       vignette and grain. Marine snow is one small additive point pass. That
       replaces a dozen blurred, blend-moded, perspective-transformed DOM
       layers plus animated SVG turbulence.

       "open"     — open water, surface out of sight. Light arrives diffuse and
                    near-parallel; scattering fills the frame and the floor
                    settles to a dim teal rather than true black.
       "twilight" — nearer the surface. Caustics and converging shafts, over a
                    fast falloff into the dark.

       WebGL is required; there is no static fallback. -->
  <canvas id="ocean" class="ocean" aria-hidden="true" data-images="{{ '/assets/images/' | relative_url }}"></canvas>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand__name">Home</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Posts</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <div class="depth-switch" role="group" aria-label="Website style">
        <button class="depth-switch__option" type="button" data-depth="open" aria-pressed="true">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M2 7c2-3 4 3 6 0s4 3 6 0 3 0 4 0M2 12c2-3 4 3 6 0s4 3 6 0 3 0 4 0" />
          </svg>
          <span>Open Water</span>
        </button>
        <button class="depth-switch__option" type="button" data-depth="twilight" aria-pressed="false">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m8 3 1.6 4.4L14 9l-4.4 1.6L8 15l-1.6-4.4L2 9l4.4-1.6L8 3ZM16 3v4m-2-2h4m-2 8v4m-2-2h4" />
          </svg>
          <span>Twilight Zone</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="site-main{% if page.layout == 'post' %} site-main--post{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}.</p>
  </footer>

  <script src="{{ '/assets/js/ocean.js' | relative_url }}" defer></script>
  <script>
    (function () {
      var root = document.documentElement;
      var options = document.querySelectorAll('.depth-switch__option');
      var meta = document.querySelector('meta[name=theme-color]');

      function paint() {
        var shallow = root.dataset.ocean === 'twilight';
        options.forEach(function (option) {
          option.setAttribute('aria-pressed', String(option.dataset.depth === root.dataset.ocean));
        });
        if (meta) meta.content = shallow ? '#010a12' : '#04202f';
      }

      options.forEach(function (option) {
        option.addEventListener('click', function () {
          root.dataset.ocean = option.dataset.depth;
          try { localStorage.setItem('ocean', root.dataset.ocean); } catch (e) {}
          paint();
        });
      });

      paint();
    })();
  </script>
</body>
</html>
